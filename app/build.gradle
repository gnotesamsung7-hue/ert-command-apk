plugins {
    id 'com.android.application'
}

android {
    namespace 'org.ccfcw.ert.command'
    compileSdk 34

    defaultConfig {
        applicationId 'org.ccfcw.ert.command'
        minSdk 26
        targetSdk 34
        // Each GitHub build gets a higher number, so a new APK installs over the old one.
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        release {
            // Same key every build, so updates install without uninstalling.
            storeFile file('ert-release.jks')
            storePassword 'ccfcwert2026'
            keyAlias 'ert'
            keyPassword 'ccfcwert2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
